<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c3a">
<title>PSX Wallet</title>
<style>
:root{--bg:#eef2ee;--surf:#fff;--ink:#122019;--mut:#617168;--line:#dde5df;--up:#0b8a55;--dn:#d1432f;--acc:#0f4c3a;--sel:#e8f1ec;--sh:0 1px 2px rgba(10,30,20,.06),0 8px 22px rgba(10,30,20,.07);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0a120e;--surf:#14201a;--ink:#e8f1ec;--mut:#8fa398;--line:#25352c;--up:#3fd08f;--dn:#ff7b6a;--sel:#1b2c23;--acc:#1c7a59;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px}
.top-in{max-width:640px;margin:0 auto}
.top h1{margin:0 0 10px;font-size:22px;letter-spacing:-.3px}
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px}
.seg[hidden]{display:none}
.seg button{flex:1;min-width:0;border:0;background:none;color:var(--mut);padding:8px 6px;border-radius:10px;font:inherit;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--acc);color:#fff}
main{padding:6px 16px 16px;max-width:640px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.card h2{margin:0 0 12px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.hero{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#0c3d2f 0%,#0f6b4e 55%,#17a673 100%);box-shadow:0 10px 28px rgba(15,76,58,.35);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero:before{content:"";position:absolute;right:30px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
.hl{opacity:.8;font-size:13px}
.hv{font-size:32px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:2px 0 8px;position:relative;z-index:1}
.hp{display:inline-block;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:99px;font-weight:600;font-size:14px;position:relative;z-index:1}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.hg span{display:block;opacity:.75;font-size:12px}.hg b{font-size:15px;font-variant-numeric:tabular-nums}
.dwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{width:176px;height:176px;animation:pop .7s ease both}
.donut .c1{font:600 11px system-ui,sans-serif;fill:var(--mut)}.donut .c2{font:700 21px system-ui,sans-serif;fill:var(--ink)}
@keyframes pop{from{opacity:0;transform:scale(.8) rotate(-30deg)}to{opacity:1;transform:none}}
.leg{flex:1;min-width:150px;display:grid;gap:7px}
.leg div{display:flex;align-items:center;gap:8px;font-size:14px}.leg i{width:11px;height:11px;border-radius:4px;flex:none}
.leg span{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mut)}
.sb{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line);margin:2px 0 8px;gap:2px}
.sb b{display:block;height:100%;transition:width .6s}
.br{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.br:first-of-type{border-top:0}
.br .brv{margin-left:auto;text-align:right;line-height:1.25}.br .brv small{display:block;color:var(--mut);font-size:12px}
.br>b{min-width:78px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sel);border-radius:99px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;vertical-align:middle}
.chip i{width:9px;height:9px;border-radius:50%}
.gl{display:grid;grid-template-columns:104px 1fr 74px;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.bd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:4px}
.gl-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-t{position:relative;height:14px;background:var(--sel);border-radius:7px}
.gl-t .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--line)}
.gl-t b{position:absolute;top:0;height:100%;border-radius:7px}
.gl-t b.up{background:var(--up)}.gl-t b.dn{background:var(--dn)}
.gl-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tv{margin:12px 0}.tvh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.tr{position:relative;height:10px;background:var(--sel);border-radius:5px}
.tr b{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#0f6b4e,#17a673)}
.tr i{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.sym{font-weight:800;font-size:18px;color:var(--ink);text-decoration:none;margin-right:6px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.pill{padding:5px 10px;border-radius:99px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.up{background:rgba(11,138,85,.14)}.pill.dn{background:rgba(209,67,47,.14)}
.hc-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hc-g span{display:block;font-size:12px;color:var(--mut)}.hc-g b{font-variant-numeric:tabular-nums}
.hc-p{display:flex;gap:12px;align-items:flex-end;margin-bottom:12px}
.hc-p label{font-size:12px;color:var(--mut);width:128px;display:flex;flex-direction:column;gap:3px;flex:none}
.hc-p input{padding:8px 10px}
.hc-p .sub{font-size:12px;color:var(--mut);line-height:1.5;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px}.acts .btn{flex:1}
.sc{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sc small{display:block;color:var(--mut);font-size:12px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surf);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;font-weight:600;padding:6px 0;border-radius:12px}
.nav button.on{color:var(--up)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#17a673,#0f6b4e);color:#fff;font-size:32px;line-height:1;box-shadow:0 8px 20px rgba(15,76,58,.45)}
.fab[hidden]{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--surf);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:su .25s ease}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 12px;font-size:18px}
.fld{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.fld label,.sets label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.fld .w{grid-column:1/-1}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
:focus-visible{outline:2px solid var(--up);outline-offset:1px}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--sel);color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff}.btn.dng{background:var(--dn);color:#fff}.btn.sm{padding:9px 12px;font-size:14px}
.row2{display:flex;gap:8px;margin-top:14px}.row2 .btn{flex:1}
.pv{margin-top:12px;font-size:14px;min-height:20px}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stack{display:grid;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:#122019;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.note{font-size:12px;color:var(--mut);text-align:center;padding:4px 10px}
</style>
</head>
<body>
<div class="top"><div class="top-in"><h1>PSX Wallet</h1><div class="seg" id="seg"></div></div></div>
<main id="main"></main>
<button class="fab" id="fab" data-act="add" aria-label="Add purchase">+</button>
<nav class="nav" id="nav"></nav>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="exceljs.min.js"></script>
<script>
var KEY="psxwallet1",H=[],T=[],CGT=15,VIEW=-1,TAB="home",SELI=-1,EDI=-1,RMODE="",LASTBR=0,LAST=0,RAF=0,SO=false;
var BR=[{n:"Broker 1",f:0},{n:"Broker 2",f:0}];
var COL=["#17a673","#d9a21b","#3b6fb6","#d1432f","#8b5fbf","#2aa7b8","#9aa32b","#d0589a","#5f6b73"],BC=["#3b6fb6","#d9a21b"];
try{var s0=JSON.parse(localStorage.getItem(KEY)||"null");if(s0){H=s0.h||[];T=s0.t||[];if(s0.cgt!==undefined)CGT=s0.cgt;if(s0.br&&s0.br.length==2)BR=s0.br;else if(s0.fee){BR[0].f=BR[1].f=s0.fee}}}catch(e){}
H.forEach(function(h){h.r=h.r||0;h.sc=h.sc||0;h.br=h.br||0});
var ICON={home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
 sales:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>'};
var TABS=[["home","Home",ICON.home],["hold","Holdings",ICON.list],["sales","Sales",ICON.sales],["set","Settings",ICON.gear]];
function $(i){return document.getElementById(i)}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function n(x,d){return Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function sg(x,d){return(x>=0?"+":"-")+n(Math.abs(x),d)}
function cls(x){return x>=0?"up":"dn"}
function cmp(x){var a=Math.abs(x);return a>=1e6?n(x/1e6,2)+"M":a>=1e3?n(x/1e3,1)+"K":n(x,0)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({h:H,t:T,br:BR,cgt:CGT}))}catch(e){}}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.k);toast.k=setTimeout(function(){t.classList.remove("on")},2800)}
function calc(h){var f=(BR[h.br||0].f||0)/100,inv=h.q*h.b,val=h.q*h.p,u=h.q?val-inv-(inv+val)*f:0;u=u>0?u*(1-CGT/100):u;var tot=u+h.r,basis=inv+h.sc;
 return{inv:inv,val:val,u:u,tot:tot,pc:basis?tot/basis*100:0,basis:basis}}
function sale(h,q,sp){var f=(BR[h.br||0].f||0)/100,p=(sp-h.b)*q-(h.b*q+sp*q)*f,tax=p>0?p*CGT/100:0;return{g:p-tax,tax:tax}}
function vis(h){return VIEW<0||(h.br||0)==VIEW}
function agg(){var A={inv:0,val:0,u:0,r:0,tot:0,basis:0},BA=[0,1].map(function(){return{inv:0,val:0,u:0,r:0,tot:0}});
 H.forEach(function(h){var c=calc(h),b=BA[h.br||0];h.c=c;b.inv+=c.inv;b.val+=c.val;b.u+=c.u;b.r+=h.r;b.tot+=c.tot;
  if(vis(h)){A.inv+=c.inv;A.val+=c.val;A.u+=c.u;A.r+=h.r;A.tot+=c.tot;A.basis+=c.basis}});
 return{A:A,BA:BA}}
function chip(b){return'<span class="chip"><i style="background:'+BC[b]+'"></i>'+esc(BR[b].n)+'</span>'}
function donut(items,total){var R=70,C=2*Math.PI*R,off=0,segs="";
 items.forEach(function(it){var len=it.v/total*C,gap=items.length>1?Math.min(3,len*.3):0,d=Math.max(len-gap,.01);
  segs+='<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="'+it.c+'" stroke-width="24" stroke-dasharray="'+d.toFixed(2)+' '+(C-d).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 100 100)"/>';off+=len});
 return'<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Allocation by market value"><circle cx="100" cy="100" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="24"/>'+segs+'<text x="100" y="96" text-anchor="middle" class="c1">MARKET VALUE</text><text x="100" y="120" text-anchor="middle" class="c2">'+cmp(total)+'</text></svg>'}
function empty(){return'<div class="card" style="text-align:center;padding:30px 18px"><div style="font-size:42px">📈</div><h3 style="margin:8px 0 4px">Your wallet is empty</h3><div class="mut" style="margin-bottom:16px">Add your first purchase to see your charts, gains and losses.</div><div class="row2"><button class="btn pri" data-act="add">Add purchase</button><button class="btn" data-act="example">Load example</button></div></div>'}
function vHome(g){
 if(!H.length)return empty();
 var A=g.A,BA=g.BA,tp=A.basis?A.tot/A.basis*100:0,o="";
 o+='<div class="hero"><div class="hl">Portfolio value</div><div class="hv" id="hv">PKR '+n(A.val,0)+'</div><div class="hp">'+(A.tot>=0?"▲":"▼")+' '+sg(A.tot,0)+' PKR · '+sg(tp,2)+'%</div><div class="hg"><div><span>Invested</span><b>'+n(A.inv,0)+'</b></div><div><span>Unrealized</span><b>'+sg(A.u,0)+'</b></div><div><span>Realized</span><b>'+sg(A.r,0)+'</b></div></div></div>';
 var by={};H.forEach(function(h){if(h.q>0&&vis(h))by[h.s]=(by[h.s]||0)+h.c.val});
 var items=Object.keys(by).map(function(k){return{l:k,v:by[k]}}).filter(function(x){return x.v>0}).sort(function(a,b){return b.v-a.v}).map(function(x,i){x.c=COL[i%COL.length];return x});
 var tot=items.reduce(function(s,x){return s+x.v},0);
 if(items.length)o+='<div class="card"><h2>Allocation by market value</h2><div class="dwrap">'+donut(items,tot)+'<div class="leg">'+items.map(function(x){return'<div><i style="background:'+x.c+'"></i>'+esc(x.l)+'<span>'+n(x.v/tot*100,1)+'%</span></div>'}).join("")+'</div></div></div>';
 var bt=BA[0].val+BA[1].val;
 o+='<div class="card"><h2>Your brokers</h2>'+(bt?'<div class="sb">'+BA.map(function(b,i){return'<b style="width:'+(b.val/bt*100)+'%;background:'+BC[i]+'"></b>'}).join("")+'</div>':"")+
  BA.map(function(b,i){return'<div class="br">'+chip(i)+'<div class="brv"><span>'+n(b.val,0)+'</span><small>invested '+n(b.inv,0)+'</small></div><b class="'+cls(b.tot)+'">'+sg(b.tot,0)+'</b></div>'}).join("")+'</div>';
 var gl=H.filter(vis).map(function(h){return{l:esc(h.s)+(VIEW<0?' <i class="bd" style="background:'+BC[h.br||0]+'"></i>':""),v:h.c.tot}});
 if(gl.length){var mx=Math.max.apply(null,gl.map(function(x){return Math.abs(x.v)}).concat([1]));
  o+='<div class="card"><h2>Gain / loss by stock</h2>'+gl.map(function(x){var w=Math.abs(x.v)/mx*50;return'<div class="gl"><div class="gl-l">'+x.l+'</div><div class="gl-t"><i class="mid"></i><b class="'+cls(x.v)+'" style="left:'+(x.v>=0?50:50-w)+'%;width:'+w+'%"></b></div><div class="gl-v '+cls(x.v)+'">'+sg(x.v,0)+'</div></div>'}).join("")+'</div>'}
 var tg=H.filter(function(h){return vis(h)&&h.q>0&&h.t!==undefined&&h.t!==null});
 if(tg.length&&A.val)o+='<div class="card"><h2>Target vs actual allocation</h2>'+tg.map(function(h){var a=h.c.val/A.val*100,d=a-h.t;return'<div class="tv"><div class="tvh"><b>'+esc(h.s)+(VIEW<0?' <i class="bd" style="background:'+BC[h.br||0]+'"></i>':"")+'</b><span class="mut">Actual '+n(a,1)+'% · Target '+n(h.t,1)+'% ('+sg(d,1)+')</span></div><div class="tr"><b style="width:'+Math.min(a,100)+'%"></b><i style="left:'+Math.min(h.t,100)+'%"></i></div></div>'}).join("")+'<div class="note">The black marker is your target.</div></div>';
 o+='<div class="note">Prices are entered by you, not live. Gains are after fees and CGT.</div>';
 return o}
function hcard(h,i){var c=h.c,open=h.q>0;
 return'<div class="card"><div class="hc-top"><div><a class="sym" href="https://dps.psx.com.pk/company/'+encodeURIComponent(h.s)+'" target="_blank" rel="noopener">'+esc(h.s)+'</a>'+chip(h.br||0)+(open?"":' <span class="tag">Closed</span>')+'</div><div class="pill '+cls(c.tot)+'">'+sg(c.tot,0)+' · '+sg(c.pc,1)+'%</div></div>'+
 '<div class="hc-g"><div><span>Shares</span><b>'+n(h.q,0)+'</b></div><div><span>Avg buy</span><b>'+n(h.b,2)+'</b></div><div><span>Value</span><b>'+n(c.val,0)+'</b></div></div>'+
 '<div class="hc-p"><label>Current price<input type="number" inputmode="decimal" step="0.01" min="0" value="'+h.p+'" data-p="'+i+'"></label><div class="sub">Unrealized <b class="'+cls(c.u)+'">'+(open?sg(c.u,0):"—")+'</b><br>Realized <b class="'+cls(h.r)+'">'+(h.sc?sg(h.r,0):"—")+'</b>'+(h.t!==undefined&&h.t!==null?'<br>Target '+n(h.t,1)+'%':"")+'</div></div>'+
 '<div class="acts">'+(open?'<button class="btn sm pri" data-act="sell" data-i="'+i+'">Sell</button>':"")+'<button class="btn sm" data-act="edit" data-i="'+i+'">Edit</button></div></div>'}
function vHold(){if(!H.length)return empty();var L=H.map(function(h,i){return vis(h)?hcard(h,i):""}).join("");return L||'<div class="card mut" style="text-align:center">No holdings with this broker yet.</div>'}
function vSales(){var L=T.filter(function(t){return VIEW<0||(t.br||0)==VIEW});
 if(!L.length)return'<div class="card mut" style="text-align:center;padding:26px">No sales yet. Open Holdings and tap Sell on a stock to record one.</div>';
 var tg=L.reduce(function(s,t){return s+t.g},0),tx=L.reduce(function(s,t){return s+(t.tx||0)},0);
 return'<div class="card"><div class="sc"><div><h2 style="margin:0">Realized gain / loss</h2><small>CGT paid '+n(tx,0)+' PKR</small></div><div class="pill '+cls(tg)+'">'+sg(tg,0)+'</div></div></div>'+
  L.map(function(t){return'<div class="card sc"><div><b style="font-size:17px">'+esc(t.s)+'</b> '+chip(t.br||0)+'<small>'+esc(t.d)+' · '+n(t.q,0)+' sh at '+n(t.sp,2)+' (avg buy '+n(t.b,2)+')</small></div><div style="text-align:right"><b class="'+cls(t.g)+'">'+sg(t.g,0)+'</b><small>CGT '+n(t.tx||0,0)+'</small></div></div>'}).join("")}
